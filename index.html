<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Lift Log">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#12161c">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<title>Lift Log</title>
<style>
  :root { --bg:#12161c; --card:#1c222b; --line:#2c3440; --text:#f3f1ea; --muted:#9aa3ad; --accent:#ff7a3d; --ok:#3ccf7a; --bad:#ff5a5a; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin:0; background:var(--bg); color:var(--text); font-family:-apple-system, system-ui, sans-serif; }
  body { padding: calc(env(safe-area-inset-top) + 12px) 16px calc(env(safe-area-inset-bottom) + 24px); }
  h1 { font-size:24px; margin:4px 0 2px; }
  h2 { font-size:17px; margin:0 0 10px; }
  .sub { color:var(--muted); font-size:14px; margin:0 0 16px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:14px; margin-bottom:14px; }
  .row { display:flex; gap:8px; align-items:center; }
  label { font-size:13px; color:var(--muted); display:block; margin-bottom:4px; }
  input[type=text], input:not([type]) { width:100%; font-size:17px; padding:10px; border-radius:10px; border:1px solid var(--line); background:#0d1015; color:var(--text); }
  button { font-size:16px; padding:10px 14px; border-radius:10px; border:1px solid var(--line); background:#262e39; color:var(--text); }
  button.primary { background:var(--accent); border-color:var(--accent); color:#1a0d05; font-weight:600; }
  button.sign { min-width:48px; font-weight:700; }
  .grow { flex:1; }
  .status { display:flex; justify-content:space-between; padding:6px 0; border-bottom:1px solid var(--line); font-size:15px; }
  .status:last-child { border-bottom:0; }
  .yes { color:var(--ok); } .no { color:var(--bad); } .meh { color:var(--muted); }
  ul.entries { list-style:none; padding:0; margin:10px 0 0; }
  ul.entries li { display:flex; justify-content:space-between; align-items:center; padding:8px 0; border-top:1px solid var(--line); font-size:15px; }
  ul.entries li button { padding:4px 10px; font-size:14px; }
  .check { padding:10px 0; border-top:1px solid var(--line); }
  .check:first-of-type { border-top:0; }
  .check p { margin:0 0 8px; font-size:15px; }
  .check .row button { flex:1; }
  .check button.on-pass { background:var(--ok); border-color:var(--ok); color:#06210f; }
  .check button.on-fail { background:var(--bad); border-color:var(--bad); color:#2a0606; }
  #msg { font-size:14px; color:var(--muted); min-height:18px; margin-top:8px; }
  .hidden-file { display:none; }
</style>
</head>
<body>
  <h1>Lift Log</h1>
  <p class="sub">Setup test · version test-v1 · this is a throwaway test, not the real app</p>

  <div class="card">
    <h2>Automatic checks</h2>
    <div class="status"><span>Opened as home-screen app</span><span id="st-standalone" class="meh">…</span></div>
    <div class="status"><span>Saved for offline use</span><span id="st-offline" class="meh">…</span></div>
    <div class="status"><span>Storage marked permanent</span><span id="st-persist" class="meh">…</span></div>
    <div class="status"><span>Test sets saved on phone</span><span id="st-count" class="meh">…</span></div>
  </div>

  <div class="card">
    <h2>Log a test set</h2>
    <label for="ex">Exercise</label>
    <input id="ex" type="text" placeholder="e.g. Bench press" autocomplete="off">
    <div class="row" style="margin-top:10px">
      <div class="grow">
        <label for="wt">Weight (lb)</label>
        <div class="row">
          <button class="sign" id="flip" type="button" aria-label="Make weight negative or positive">±</button>
          <input id="wt" inputmode="decimal" placeholder="0" autocomplete="off">
        </div>
      </div>
      <div style="width:90px">
        <label for="reps">Reps</label>
        <input id="reps" inputmode="numeric" pattern="[0-9]*" placeholder="0" autocomplete="off">
      </div>
    </div>
    <button class="primary" id="save" style="width:100%; margin-top:12px">Save set</button>
    <ul class="entries" id="list"></ul>
  </div>

  <div class="card">
    <h2>CSV file</h2>
    <div class="row">
      <button class="grow" id="export">Export CSV</button>
      <button class="grow" id="importBtn">Import CSV</button>
      <input class="hidden-file" id="importFile" type="file" accept=".csv,text/csv,text/comma-separated-values,text/plain">
    </div>
    <div id="msg"></div>
  </div>

  <div class="card" id="checks">
    <h2>Your checklist</h2>
  </div>
  <button id="copy" style="width:100%">Copy results to send to Claude</button>

<script>
// ---------- Storage (IndexedDB: the phone's built-in database for web apps) ----------
const DB_NAME = 'liftlog-test', STORE = 'sets';
function openDB() {
  return new Promise((res, rej) => {
    const r = indexedDB.open(DB_NAME, 1);
    r.onupgradeneeded = () => r.result.createObjectStore(STORE, { keyPath: 'id' });
    r.onsuccess = () => res(r.result);
    r.onerror = () => rej(r.error);
  });
}
async function tx(mode, fn) {
  const db = await openDB();
  return new Promise((res, rej) => {
    const t = db.transaction(STORE, mode);
    const out = fn(t.objectStore(STORE));
    t.oncomplete = () => res(out && out.result !== undefined ? out.result : out);
    t.onerror = () => rej(t.error);
  });
}
const allSets = () => tx('readonly', (s) => s.getAll());
const putSet = (row) => tx('readwrite', (s) => s.put(row));
const delSet = (id) => tx('readwrite', (s) => s.delete(id));

// ---------- UI helpers ----------
const $ = (id) => document.getElementById(id);
function setStatus(id, ok, text) { const el = $(id); el.textContent = text; el.className = ok === null ? 'meh' : ok ? 'yes' : 'no'; }
function say(t) { $('msg').textContent = t; }
function esc(s) { return String(s).replace(/[&<>"]/g, (c) => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;' }[c])); }

async function render() {
  const rows = (await allSets()).sort((a, b) => b.logged.localeCompare(a.logged));
  setStatus('st-count', rows.length > 0, rows.length + (rows.length === 1 ? ' set' : ' sets'));
  $('list').innerHTML = rows.map((r) =>
    `<li><span>${esc(r.exercise || '(no name)')} — ${esc(r.weight)} lb × ${esc(r.reps)}<br><small style="color:var(--muted)">${esc(isNaN(new Date(r.logged)) ? r.logged : new Date(r.logged).toLocaleString([], { dateStyle: 'medium', timeStyle: 'short' }))}</small></span>` +
    `<button data-del="${esc(r.id)}">Delete</button></li>`).join('');
}

$('list').addEventListener('click', async (e) => {
  const id = e.target.getAttribute('data-del');
  if (id) { await delSet(id); render(); }
});

$('flip').addEventListener('click', () => {
  const v = $('wt').value.trim();
  $('wt').value = v.startsWith('-') ? v.slice(1) : '-' + v;
});

$('save').addEventListener('click', async () => {
  const weight = parseFloat($('wt').value), reps = parseInt($('reps').value, 10);
  if (isNaN(weight) || isNaN(reps)) { say('Enter a weight and reps first.'); return; }
  const id = (crypto.randomUUID ? crypto.randomUUID() : String(Date.now()) + Math.random().toString(16).slice(2));
  await putSet({ id, exercise: $('ex').value.trim(), weight, reps, logged: new Date().toISOString() });
  $('wt').value = ''; $('reps').value = '';
  say('Saved.');
  render();
});

// ---------- CSV ----------
const COLS = ['id', 'exercise', 'weight', 'reps', 'logged'];
function toCSV(rows) {
  const q = (v) => { const s = String(v ?? ''); return /[",\n\r]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; };
  return [COLS.join(','), ...rows.map((r) => COLS.map((c) => q(r[c])).join(','))].join('\r\n') + '\r\n';
}
function parseCSV(text) {
  const rows = []; let row = [], cell = '', i = 0, inQ = false;
  text = text.replace(/^﻿/, '');
  while (i < text.length) {
    const c = text[i];
    if (inQ) {
      if (c === '"' && text[i + 1] === '"') { cell += '"'; i += 2; continue; }
      if (c === '"') { inQ = false; i++; continue; }
      cell += c; i++; continue;
    }
    if (c === '"') { inQ = true; i++; continue; }
    if (c === ',') { row.push(cell); cell = ''; i++; continue; }
    if (c === '\r') { i++; continue; }
    if (c === '\n') { row.push(cell); rows.push(row); row = []; cell = ''; i++; continue; }
    cell += c; i++;
  }
  if (cell !== '' || row.length) { row.push(cell); rows.push(row); }
  return rows.filter((r) => r.some((x) => x.trim() !== ''));
}

$('export').addEventListener('click', async () => {
  const csv = toCSV(await allSets());
  const name = 'lift-log-' + new Date().toISOString().slice(0, 10) + '.csv';
  const file = new File([csv], name, { type: 'text/csv' });
  try {
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      await navigator.share({ files: [file] });
      say('Share sheet opened — choose "Save to Files".');
      return;
    }
  } catch (err) {
    if (err && err.name === 'AbortError') { say('Export cancelled.'); return; }
  }
  const a = document.createElement('a');
  a.href = URL.createObjectURL(file); a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  say('Downloaded ' + name + '.');
});

$('importBtn').addEventListener('click', () => $('importFile').click());
$('importFile').addEventListener('change', async (e) => {
  const f = e.target.files[0]; if (!f) return;
  try {
    const rows = parseCSV(await f.text());
    const head = rows.shift().map((h) => h.trim().toLowerCase());
    const idx = Object.fromEntries(COLS.map((c) => [c, head.indexOf(c)]));
    if (idx.weight < 0 || idx.reps < 0) throw new Error('Missing "weight" or "reps" column');
    let added = 0, updated = 0;
    const existing = new Set((await allSets()).map((r) => r.id));
    for (const r of rows) {
      const get = (c) => (idx[c] >= 0 ? (r[idx[c]] ?? '').trim() : '');
      const weight = parseFloat(get('weight')), reps = parseInt(get('reps'), 10);
      if (isNaN(weight) || isNaN(reps)) continue;
      const id = get('id') || ('imp-' + Date.now() + '-' + Math.random().toString(16).slice(2));
      existing.has(id) ? updated++ : added++;
      await putSet({ id, exercise: get('exercise'), weight, reps, logged: get('logged') || new Date().toISOString() });
    }
    say(`Imported: ${added} new, ${updated} updated.`);
    render();
  } catch (err) {
    say('Import failed: ' + err.message);
  }
  e.target.value = '';
});

// ---------- Checklist ----------
const CHECKS = [
  'Opens full screen from the home-screen icon (no Safari bars)',
  'Lift Log icon and name look right on the home screen',
  'Weight and reps fields bring up the number pad; ± makes the weight negative',
  'Saved sets are still there after swiping the app closed and reopening',
  'Saved sets are still there after restarting the phone',
  'In Airplane Mode: app opens and can save a set',
  'Export CSV → "Save to Files" works and the file opens in Numbers or Excel',
  'Import CSV: after editing a value in the file and importing it, the change shows here'
];
const CK = 'liftlog-test-checks';
function loadChecks() { try { return JSON.parse(localStorage.getItem(CK)) || {}; } catch { return {}; } }
function saveChecks(v) { try { localStorage.setItem(CK, JSON.stringify(v)); } catch {} }
function renderChecks() {
  const st = loadChecks();
  $('checks').innerHTML = '<h2>Your checklist</h2>' + CHECKS.map((t, i) =>
    `<div class="check"><p>${i + 1}. ${esc(t)}</p><div class="row">` +
    `<button data-i="${i}" data-v="pass" class="${st[i] === 'pass' ? 'on-pass' : ''}">Works</button>` +
    `<button data-i="${i}" data-v="fail" class="${st[i] === 'fail' ? 'on-fail' : ''}">Problem</button></div></div>`).join('');
}
$('checks').addEventListener('click', (e) => {
  const i = e.target.getAttribute('data-i'); if (i === null) return;
  const st = loadChecks(); const v = e.target.getAttribute('data-v');
  st[i] = st[i] === v ? undefined : v; saveChecks(st); renderChecks();
});
$('copy').addEventListener('click', async () => {
  const st = loadChecks();
  const lines = CHECKS.map((t, i) => `${i + 1}. ${st[i] === 'pass' ? 'WORKS' : st[i] === 'fail' ? 'PROBLEM' : 'not tested'} — ${t}`);
  lines.push('Auto: standalone=' + $('st-standalone').textContent + ', offline=' + $('st-offline').textContent +
    ', persist=' + $('st-persist').textContent + ', sets=' + $('st-count').textContent);
  lines.push('Device: ' + navigator.userAgent);
  const text = lines.join('\n');
  try { await navigator.clipboard.writeText(text); $('copy').textContent = 'Copied! Paste it to Claude'; }
  catch { prompt('Copy this:', text); }
});

// ---------- Automatic checks ----------
const standalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
setStatus('st-standalone', standalone, standalone ? 'Yes' : 'No (in browser)');

async function checkOffline() {
  if (!('serviceWorker' in navigator)) { setStatus('st-offline', false, 'Not supported'); return; }
  try {
    await navigator.serviceWorker.register('sw.js');
    await navigator.serviceWorker.ready;
    const keys = await caches.keys();
    setStatus('st-offline', keys.length > 0, keys.length > 0 ? 'Yes' : 'Not yet');
  } catch (e) { setStatus('st-offline', false, 'Failed'); }
}
async function checkPersist() {
  if (!navigator.storage || !navigator.storage.persist) { setStatus('st-persist', null, 'Not available'); return; }
  let p = await navigator.storage.persisted();
  if (!p) p = await navigator.storage.persist();
  setStatus('st-persist', p, p ? 'Yes' : 'No');
}

renderChecks();
render();
checkOffline();
checkPersist();
</script>
</body>
</html>
