# Publishes the app to GitHub Pages:
#   main -> https://punydata.github.io/lift-log/      (live)
#   dev  -> https://punydata.github.io/lift-log/dev/  (dev, for testing on the phone first)
# Runs on a push to main, after "Dev pushed" finishes (a push to dev), or by hand
# (Actions tab -> Deploy to Pages -> Run workflow). It always runs from main.
name: Deploy to Pages
on:
  push:
    branches: [main]
  workflow_run:
    workflows: [Dev pushed]
    types: [completed]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with: { ref: main, path: main }
      - uses: actions/checkout@v4
        with: { ref: dev, path: dev }
      - run: bash main/scripts/build-site.sh main dev _site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: _site }
      - id: deployment
        uses: actions/deploy-pages@v4
