# A push to dev starts "Deploy to Pages" on main (GitHub Pages only accepts
# deploys started from main by default). That run publishes both copies.
name: Dev pushed
on:
  push:
    branches: [dev]
permissions:
  actions: write
  contents: read
jobs:
  trigger-deploy:
    runs-on: ubuntu-latest
    steps:
      - run: gh workflow run deploy.yml --ref main -R "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ github.token }}
